<body>

            </li>
        </ul>
    </nav>

    <section>
        <form>
            <fieldset>
                <legend>Report a Website Issue?</legend>
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
                <br/>
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
                <br/>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <br/>
                <fieldset>
                    <legend>What issue are you facing?</legend>
                    <input type="checkbox" id="Images" name="Images" value="Images"/>
                    <label for="Images">Website Images</label>
                    <input type="checkbox" id="text" name="text" value="text"/>
                    <label for="text">Websites Texts</label>
                    <input type="checkbox" id="other" name="other" value="other"/>
                    <label for="other">Other Issue</label>
                </fieldset>
                <br/>
                <label for="issue">Write Down Your Issue</label>
                <select id="issue" name="issue" required>
                    <option value="theImages">Website Images</option>
                    <option value="theText">Websites Texts</option>
                    <option value="theOther">Other Issue</option>
                </select>
                <textarea name="writeDown" id="10" cols="50" maxlength="400"
                   placeholder="Write Down Here" required></textarea>
                <input type="Submit" value="Submit"/>
            </fieldset>
        </form>
    </section>
    
    <footer>
    </footer>
